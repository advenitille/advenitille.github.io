<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Проверка хостинга</title>
<style>
  body{margin:0;background:#0a0a09;color:#ecebe6;font:16px/1.5 system-ui,sans-serif;padding:24px}
  h1{font-size:24px;margin:0 0 4px} .host{color:#d6a24e;margin:0 0 20px}
  table{border-collapse:collapse;width:100%;max-width:640px}
  td{padding:8px 6px;border-bottom:1px solid #2a2a27;font-size:14px}
  .verdict{margin:24px 0 0;font-size:20px;font-weight:700}
  .ok{color:#7fd17f} .bad{color:#e0775f}
</style>
</head>
<body>
<h1>Проверка хостинга</h1>
<p class="host" id="host"></p>
<table id="rows"></table>
<p class="verdict" id="verdict">Проверяю…</p>
<p>Сделайте скриншот этой страницы и пришлите Claude. Проверяйте <b>без VPN</b>: с домашнего Wi-Fi и с мобильного интернета.</p>
<script>
  const files = ['/uploads/hero/utopia-02.webp','/uploads/hero/greenunicorn-01.webp','/uploads/hero/richey-01.webp',
                 '/uploads/hero/albert-01.webp','/fonts/Satoshi-Variable.woff2','/admin/decap-cms.js'];
  document.getElementById('host').textContent = location.host + ' · ' + new Date().toLocaleString('ru-RU');
  const rows = document.getElementById('rows');
  (async () => {
    let ok = 0, start = performance.now();
    for (const f of files) {
      const tr = rows.insertRow(); tr.insertCell().textContent = f.split('/').pop();
      const cell = tr.insertCell(); cell.textContent = '…';
      const t0 = performance.now();
      try {
        const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 15000);
        const r = await fetch(f + '?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
        const b = await r.arrayBuffer(); clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        cell.innerHTML = '<span class="ok">✅ ' + Math.round(b.byteLength/1024) + ' КБ за ' + ((performance.now()-t0)/1000).toFixed(1) + ' с</span>';
        ok++;
      } catch (e) {
        cell.innerHTML = '<span class="bad">❌ ' + (e.name === 'AbortError' ? 'не загрузилось за 15 с' : e.message) + '</span>';
      }
    }
    const v = document.getElementById('verdict');
    const total = ((performance.now()-start)/1000).toFixed(1);
    v.innerHTML = ok === files.length ? '<span class="ok">Работает: всё загрузилось за ' + total + ' с</span>'
                                      : '<span class="bad">Проблема: загрузилось ' + ok + ' из ' + files.length + '</span>';
  })();
</script>
</body>
</html>
