<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Проверка формы</title>
<style>
  body{margin:0;background:#0a0a09;color:#ecebe6;font:16px/1.5 system-ui,sans-serif;padding:24px;max-width:560px}
  h1{font-size:24px;margin:0 0 6px} p{color:#a9a79f}
  input,textarea{width:100%;box-sizing:border-box;margin:6px 0 14px;padding:10px;background:#141412;color:#ecebe6;border:1px solid #2a2a27;border-radius:6px;font:inherit}
  button{padding:12px 22px;border:0;border-radius:999px;background:#ecebe6;color:#0a0a09;font:600 16px system-ui;cursor:pointer}
  #status{margin-top:18px;font-size:18px;font-weight:700}
  .ok{color:#7fd17f} .bad{color:#e0775f}
</style>
</head>
<body>
<h1>Проверка формы заявки</h1>
<p>Отправьте заявку <b>без VPN</b>. Если она придёт в Telegram от бота — форма работает из России.</p>
<form id="f">
  <label>Имя<input name="name" required value="Тест из России"></label>
  <label>Как связаться<input name="contact" required value="test"></label>
  <label>Сообщение<textarea name="message" required rows="3">Проверка формы с GitHub Pages через Cloudflare Worker</textarea></label>
  <input type="hidden" name="t" id="t">
  <button type="submit">Отправить</button>
</form>
<p id="status"></p>
<script>
  document.getElementById('t').value = String(Date.now());
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const s = document.getElementById('status');
    const data = Object.fromEntries(new FormData(e.target).entries());
    data.message += ' · ' + navigator.userAgent.split(') ')[0] + ')';
    s.className = ''; s.textContent = 'Отправляю…';
    const t0 = performance.now();
    try {
      const r = await fetch('https://api.advenitille.com/api/lead/', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      });
      const sec = ((performance.now() - t0) / 1000).toFixed(1);
      if (!r.ok) throw new Error('сервер ответил ' + r.status);
      s.className = 'ok'; s.textContent = '✅ Отправлено за ' + sec + ' с. Проверьте Telegram.';
    } catch (err) {
      s.className = 'bad'; s.textContent = '❌ Не отправилось: ' + err.message;
    }
  });
</script>
</body>
</html>
