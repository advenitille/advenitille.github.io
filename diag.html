<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Диагностика</title>
<style>
  body{margin:0;background:#0a0a09;color:#ecebe6;font:15px/1.5 system-ui,sans-serif;padding:20px;max-width:640px}
  h1{font-size:22px;margin:0 0 12px} td{padding:7px 6px;border-bottom:1px solid #2a2a27;vertical-align:top}
  .ok{color:#7fd17f} .bad{color:#e0775f} small{color:#8d8b84;word-break:break-all}
</style>
</head>
<body>
<h1>Диагностика соединения</h1>
<table id="t"></table>
<p><small id="ua"></small></p>
<script>
  const W = 'https://advenitille-api.cher10101077.workers.dev';
  const tests = [
    ['GitHub Pages (этот сайт)', location.origin + '/favicon.svg', 'cors'],
    ['Сервис формы — проверка связи', W + '/healthz', 'no-cors'],
    ['Сервис формы — предварительный запрос', W + '/api/lead/', 'preflight'],
    ['Сайт Cloudflare', 'https://www.cloudflare.com/favicon.ico', 'no-cors'],
    ['Telegram', 'https://telegram.org/favicon.ico', 'no-cors'],
  ];
  document.getElementById('ua').textContent = navigator.userAgent;
  const t = document.getElementById('t');
  (async () => {
    for (const [name, url, mode] of tests) {
      const tr = t.insertRow(); tr.insertCell().textContent = name; const c = tr.insertCell(); c.textContent = '…';
      const t0 = performance.now();
      try {
        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 10000);
        const opts = mode === 'preflight'
          ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}', signal: ctrl.signal }
          : { mode, cache: 'no-store', signal: ctrl.signal };
        const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), opts);
        c.innerHTML = '<span class="ok">✅ ' + (r.type === 'opaque' ? 'доступен' : r.status) + ' · ' + ((performance.now() - t0) / 1000).toFixed(1) + ' с</span>';
      } catch (e) {
        c.innerHTML = '<span class="bad">❌ ' + (e.name === 'AbortError' ? 'нет ответа 10 с' : e.message) + '</span>';
      }
    }
  })();
</script>
</body>
</html>
